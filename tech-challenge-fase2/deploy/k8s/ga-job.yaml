# Otimização pesada do AG como Job em lote (fora da API).
# Cada experimento roda em um pod próprio, em paralelo (Indexed Job):
#   kubectl apply -f deploy/k8s/ga-job.yaml
# Os resultados ficam no volume "results"; em nuvem, troque por um bucket (S3/GCS).
apiVersion: batch/v1
kind: Job
metadata:
  name: ga-experiments
  namespace: tech-challenge
spec:
  completionMode: Indexed
  completions: 2          # 0 = logistic_regression, 1 = random_forest
  parallelism: 2
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ga
          image: ghcr.io/gusta2150/tech-challenge-fase2:latest   # IMAGE
          command: ["/bin/sh", "-c"]
          args:
            - |
              MODELS="logistic_regression random_forest"
              MODEL=$(echo $MODELS | cut -d' ' -f$((JOB_COMPLETION_INDEX+1)))
              python -m scripts.run_experiments --models $MODEL
              cp reports/results/experiments.json /results/experiments_$MODEL.json
          env:
            - { name: LOG_FORMAT, value: json }
          resources:
            requests: { cpu: "2", memory: "1Gi" }
            limits: { cpu: "4", memory: "2Gi" }
          volumeMounts:
            - { name: results, mountPath: /results }
      volumes:
        - name: results
          emptyDir: {}
