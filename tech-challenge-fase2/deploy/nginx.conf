# Balanceamento entre as réplicas da API. Usar a URL numa variável faz o nginx
# re-resolver "api" pelo DNS do Docker a cada 10 s — assim réplicas adicionadas
# com `docker compose up --scale api=N` passam a receber tráfego sem reiniciar.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
}
