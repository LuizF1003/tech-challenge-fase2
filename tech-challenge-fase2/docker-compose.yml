# Ambiente local completo: API escalável + balanceador + Prometheus + Grafana.
#   docker compose up --build --scale api=3
# API (via nginx): http://localhost:8080/docs   Prometheus: :9090   Grafana: :3000 (admin/admin)

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    expose:
      - "8000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus

  # LLM local opcional (LLaMA via Ollama). Ative com: docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
